name: Epson Printer
version: "2.1.4"
slug: cupsik
description: CUPS print server with AirPrint and Epson USB queue support
image: ghcr.io/duyleekun/homeassistant-epson-cupsik
arch:
  - amd64
usb: true
init: false
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 631
panel_icon: mdi:printer-wireless
panel_title: Epson Printer
ports:
  631/tcp: 631
  631/udp: 631
ports_description:
  631/tcp: IPP, AirPrint, and CUPS administration
  631/udp: Legacy IPP discovery (Bonjour uses host UDP 5353)
options:
  admin_password: ""
schema:
  admin_password: password
map:
  - app_config:rw
  - share:rw
