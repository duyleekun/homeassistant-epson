name: Publish Home Assistant apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      epson_release:
        description: Private release containing the Epson Scan 2 packages and native libraries
        required: true
        default: epson-scan2-6.7.92

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: sane_l3210
            image: ghcr.io/duyleekun/homeassistant-epson-sane_l3210
            context: sane_l3210
            platforms: linux/amd64
          - app: cupsik
            image: ghcr.io/duyleekun/homeassistant-epson-cupsik
            context: cupsik
            platforms: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage private Epson assets
        if: matrix.app == 'sane_l3210'
        env:
          GH_TOKEN: ${{ github.token }}
          EPSON_RELEASE: ${{ inputs.epson_release || 'epson-scan2-6.7.92' }}
        run: |
          mkdir -p apps/sane_l3210/packages apps/sane_l3210/rootfs/opt/es2button/lib
          gh release download "$EPSON_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'epsonscan2_6.7.92.0-1_amd64.deb' \
            --pattern 'epsonscan2-non-free-plugin_1.0.0.6-1_amd64.deb' \
            --pattern 'libcommonutility.so' \
            --pattern 'libes2command.so' \
            --dir "$RUNNER_TEMP/epson-assets"
          cp "$RUNNER_TEMP/epson-assets/"*.deb apps/sane_l3210/packages/
          cp "$RUNNER_TEMP/epson-assets/"*.so apps/sane_l3210/rootfs/opt/es2button/lib/
          sha256sum apps/sane_l3210/packages/*.deb

      - name: Prepare patched CUPS app
        if: matrix.app == 'cupsik'
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          mkdir -p "$RUNNER_TEMP/apps/cupsik"
          git -C third_party/cups-airprint archive HEAD | tar -x -C "$RUNNER_TEMP/apps/cupsik"
          patch --batch --forward -p1 -d "$RUNNER_TEMP/apps/cupsik" \
            < patches/cupsik/0001-homeassistant-ingress-and-local-monitor.patch
          cp -a patches/cupsik/overlay/. "$RUNNER_TEMP/apps/cupsik/"

      - name: Select build context
        run: |
          if [ "${{ matrix.app }}" = sane_l3210 ]; then
            echo "BUILD_CONTEXT=apps/sane_l3210" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONTEXT=$RUNNER_TEMP/apps/cupsik" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@v3
        if: matrix.app == 'cupsik'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base:7.6.2
